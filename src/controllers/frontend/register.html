<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WeatherWise - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ AI WeatherWise</h1>
        <p class="subtitle">Create your account</p>

        <div class="weather-card">

            <h2>📝 Register</h2>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                style="width:100%; padding:15px; margin:10px 0; border-radius:10px; border:none;"
            >

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                style="width:100%; padding:15px; margin:10px 0; border-radius:10px; border:none;"
            >

            <input
                type="password"
                id="password"
                placeholder="Create password"
                style="width:100%; padding:15px; margin:10px 0; border-radius:10px; border:none;"
            >

            <button
                onclick="register()"
                style="width:100%; padding:15px; margin-top:15px; border:none; border-radius:10px; background:#00d9ff; font-weight:bold; cursor:pointer;"
            >
                Create Account
            </button>

            <p id="registerMessage" style="margin-top:20px;"></p>

            <p style="margin-top:20px;">
                Already have an account?
                <a href="login.html" style="color:#00d9ff;">
                    Login
                </a>
            </p>

        </div>

    </div>

    <script>

        const API_BASE_URL = "http://localhost:5001";

        async function register() {

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const message = document.getElementById("registerMessage");

            if (!name || !email || !password) {
                message.textContent = "Please fill all fields.";
                return;
            }

            try {

                const response = await fetch(
                    `${API_BASE_URL}/api/auth/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );

                const result = await response.json();

                console.log("Register Response:", result);

                if (!response.ok) {
                    throw new Error(
                        result.message || "Registration failed"
                    );
                }

                // Save JWT token
                localStorage.setItem(
                    "token",
                    result.data.token
                );

                message.textContent =
                    "Account created successfully!";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);

            } catch (error) {

                console.error("Register Error:", error);

                message.textContent = error.message;
            }
        }

    </script>

</body>
</html>
